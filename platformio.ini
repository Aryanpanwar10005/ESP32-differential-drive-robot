# ========================================
# MAIN PRODUCTION ENVIRONMENT
# ========================================
[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600

lib_deps = 
    madhephaestus/ESP32Servo@^1.2.1
    mikalhart/TinyGPSPlus@^1.0.3
    gilmaimon/ArduinoWebsockets@^0.5.3
    bblanchon/ArduinoJson@^7.0.0

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DDEBUG_MODE=1

# ========================================
# STANDALONE MODULE TESTING ENVIRONMENTS
# Note: Test files are standalone and can be
# compiled separately by moving to src folder
# ========================================

[env:motor_test]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

lib_deps = 
    madhephaestus/ESP32Servo@^1.2.1

build_src_filter =
    +<modules/motor_control.cpp>
    +<config.h>
    -<main.cpp>
    -<modules/network*>
    -<modules/ble_auth*>
    -<modules/camera*>
    -<modules/gps*>
    -<modules/servo*>

test_build_src = true

[env:gps_test]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

lib_deps = 
    mikalhart/TinyGPSPlus@^1.0.3

build_src_filter =
    +<modules/gps_module.cpp>
    +<config.h>
    -<main.cpp>
    -<modules/network*>
    -<modules/ble_auth*>
    -<modules/camera*>
    -<modules/motor*>
    -<modules/servo*>

test_build_src = true
