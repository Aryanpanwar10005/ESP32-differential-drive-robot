[common]
lib_deps = 
    mikalhart/TinyGPSPlus @ ^1.0.3
    madhephaestus/ESP32Servo @ ^3.0.5
    bblanchon/ArduinoJson @ ^7.2.1

# ========================================
# MAIN PRODUCTION ENVIRONMENT
# ========================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600

lib_deps = 
    ${common.lib_deps}
    gilmaimon/ArduinoWebsockets @ ^0.5.4

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DDEBUG_MODE=1

# ========================================
# STANDALONE MODULE TESTING ENVIRONMENTS
# ========================================

[env:motor_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

test_build_src = false
build_src_filter = 
    +<../test/motor_test.cpp>
    +<modules/motor_control.cpp>
    +<config.h>

lib_deps = 
    ${common.lib_deps}

[env:gps_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

test_build_src = false
build_src_filter = 
    +<../test/gps_test.cpp>
    +<modules/gps_module.cpp>
    +<config.h>

lib_deps = 
    ${common.lib_deps}

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

build_flags =
    -DUSE_ESP32_CAM

lib_deps =
    ${common.lib_deps}
    gilmaimon/ArduinoWebsockets @ ^0.5.4

monitor_speed = 115200
